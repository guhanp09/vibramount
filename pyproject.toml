[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vibramount"
version = "0.1.0"
description = "Compressor isolation design using SDOF dynamics and parametric FreeCAD assemblies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.6,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.3"]
[project.scripts]
vibramount = "vibramount.study:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
